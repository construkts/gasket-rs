[package]
name = "gasket-prometheus"
version = "0.11.0"
edition = "2021"
description = "Prometheus metric exporter for the Gasket framework"
repository = "https://github.com/construkts/gasket-rs"
homepage = "https://github.com/construkts/gasket-rs"
documentation = "https://docs.rs/gasket"
license = "Apache-2.0"
readme = "../README.md"
authors = ["Santiago Carmuega <santiago@carmuega.me>"]

[dependencies]
gasket = { version = "0.11.0", path = "../gasket" }
tokio = { version = "1", features = ["net", "io-util", "rt"] }
tracing = "0.1.37"
