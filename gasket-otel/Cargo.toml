[package]
name = "gasket-otel"
version = "0.12.0"
edition = "2021"
description = "OpenTelemetry metrics bridge for the Gasket framework"
repository = "https://github.com/construkts/gasket-rs"
homepage = "https://github.com/construkts/gasket-rs"
documentation = "https://docs.rs/gasket-otel"
license = "Apache-2.0"
readme = "README.md"
authors = ["Santiago Carmuega <santiago@carmuega.me>"]

[dependencies]
gasket = { version = "0.12.0", path = "../gasket" }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }

[dev-dependencies]
async-trait = "0.1.68"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "testing"] }
tokio = { version = "1", features = ["time"] }
